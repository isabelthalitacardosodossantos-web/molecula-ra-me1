```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Molécula 3D - 2-bromo-2-metilbutano</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #101827;
      color: white;
    }

    model-viewer {
      width: 100%;
      height: 65vh;
      background: #f2f5f8;
      border-radius: 16px;
    }

    .botao {
      margin-top: 16px;
      padding: 14px 20px;
      background: #f59e0b;
      color: #111827;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Laboratório E2</h1>

  <p>Molécula: 2-bromo-2-metilbutano (C₅H₁₁Br)</p>

  <model-viewer
    src="2-bromo-2-metilbutano.glb"
    ios-src="2-bromo-2-metilbutano.usdz"
    alt="Modelo molecular 3D do 2-bromo-2-metilbutano"
    camera-controls
    auto-rotate
    ar
    ar-modes="scene-viewer webxr quick-look"
    ar-placement="floor"
    shadow-intensity="1"
    exposure="1">

    <button slot="ar-button" class="botao">
      Visualizar molécula em RA
    </button>

  </model-viewer>

  <p>Gire o modelo ou toque no botão de RA para explorar.</p>

</body>
</html>
